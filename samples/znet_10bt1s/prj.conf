# Core SPI
CONFIG_SPI=y
CONFIG_SPI_DW=y
CONFIG_SPI_DW_USE_IRQ=n
CONFIG_SPI_DW_POLLING_TIMEOUT_US=50000

# =========================
# Pin Controller
# =========================
CONFIG_PINCTRL=y
CONFIG_PINCTRL_RP1=y
# Logging for RP1 pinctrl
CONFIG_PINCTRL_RP1_LOG_LEVEL_DBG=y

# Ensure GPIO is enabled (required for bitbang)
CONFIG_GPIO=y

# Network stack
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y

# LAN865x + MDIO
CONFIG_ETH_LAN865X=y
CONFIG_MDIO=y
CONFIG_MDIO_LAN865X=y
CONFIG_ETH_LAN865X_USE_IRQ=n
CONFIG_ETH_LAN865X_IRQ_THREAD_PRIO=10
CONFIG_ETH_LAN865X_IRQ_THREAD_STACK_SIZE=4096

# === Console / UART ===
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=50

# printk / log
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=4

CONFIG_PM=y
CONFIG_PM_DEVICE=y

CONFIG_PCIE=y
CONFIG_PCIE_CONTROLLER=y
CONFIG_PCIE_MSI=y
CONFIG_DYNAMIC_INTERRUPTS=y

CONFIG_I2C=n
CONFIG_I2C_DW=n
CONFIG_I2C_SHELL=n
CONFIG_I2C_LOG_LEVEL_DBG=n

CONFIG_GPIO_FXL6408=n

CONFIG_KERNEL_LOG_LEVEL_INF=y
CONFIG_KERNEL_LOG_LEVEL_DBG=n