# nothing here
# Enable pinctrl driver for RP1
CONFIG_PINCTRL=y
CONFIG_PINCTRL_RP1=y
CONFIG_PINCTRL_RP1_LOG_LEVEL_DBG=y

CONFIG_GPIO=y
CONFIG_GPIO_RP1=y
#CONFIG_GPIO_LOG_LEVEL_DEG=y

# === Console / UART ===
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_INIT_PRIORITY=50

# printk / log
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=4